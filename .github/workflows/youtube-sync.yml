name: Update YouTube videos

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python sync_youtube.py

      - name: Build static blog
        run: |
          pip install -r requirements-blog.txt
          python scripts/build_blog.py
          python scripts/check_site.py
          python scripts/test_blog_updates.py
          python scripts/test_platform.py
          python scripts/test_youtube_sync.py

      - name: Save video data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-videos.js
          git diff --cached --quiet || (git commit -m 'Update public YouTube videos' && git push)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}

      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '[.artifacts[] | select(.expired == false)] | length') || count=0
            if [[ "$count" == 1 ]]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact $PAGES_ARTIFACT was not available for deployment" >&2
          exit 1

      - name: Publish site
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
