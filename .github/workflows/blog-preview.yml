name: Validate and preview blog
on:
  pull_request:
  push:
    branches: [feat/trivia-blog]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-blog.txt
      - run: python scripts/build_blog.py
      - run: python scripts/check_site.py
      - run: python scripts/test_blog_updates.py
      - run: python scripts/test_youtube_sync.py
      - run: python scripts/test_platform.py
      - run: python scripts/editorial.py
      - run: python scripts/test_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: _site/
          retention-days: 14
