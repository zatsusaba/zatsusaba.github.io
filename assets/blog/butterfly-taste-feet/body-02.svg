<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="1000" height="1010" rx="24" fill="#f6f4e9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="55" y="90" font-size="52" fill="#163a35" font-weight="700">自分と子どもで、食事は別</text><rect x="45" y="135" width="910" height="390" rx="24" fill="#fbedd3"/><text x="85" y="205" font-size="50" fill="#163a35" font-weight="700">成虫の食事</text><text x="85" y="276" font-size="44" fill="#163a35" font-weight="400">蜜などの液体</text><text x="85" y="455" font-size="48" fill="#163a35" font-weight="700">口吻で吸う</text><text x="85" y="510" font-size="40" fill="#163a35" font-weight="400">味覚は足以外にも</text><circle cx="745" cy="339" r="45" fill="#d89b54"/><ellipse cx="680" cy="315" rx="44" ry="30" fill="#ebbd99"/><ellipse cx="710" cy="275" rx="44" ry="30" fill="#ebbd99"/><ellipse cx="765" cy="278" rx="44" ry="30" fill="#ebbd99"/><ellipse cx="802" cy="318" rx="44" ry="30" fill="#ebbd99"/><ellipse cx="790" cy="368" rx="44" ry="30" fill="#ebbd99"/><ellipse cx="727" cy="395" rx="44" ry="30" fill="#ebbd99"/><ellipse cx="679" cy="365" rx="44" ry="30" fill="#ebbd99"/><rect x="45" y="555" width="910" height="410" rx="24" fill="#e4eee2"/><text x="85" y="625" font-size="50" fill="#163a35" font-weight="700">幼虫の食事</text><text x="85" y="696" font-size="44" fill="#163a35" font-weight="400">種類に合う植物の葉</text><g transform="translate(635 730) scale(1.05)"><path d="M0 90 Q90 -30 250 5 Q225 135 0 90" fill="#88b68a"/><path d="M0 90 L222 21" fill="none" stroke="#416e50" stroke-width="5"/></g><text x="85" y="865" font-size="44" fill="#163a35" font-weight="700">雌が葉に触れて</text><text x="85" y="925" font-size="44" fill="#163a35" font-weight="700">産卵場所を選ぶ</text></g></svg>