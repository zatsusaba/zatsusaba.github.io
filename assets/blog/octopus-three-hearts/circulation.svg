<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110" role="img" aria-labelledby="t d"><title id="t">タコの3つの心臓と血液の流れ</title><desc id="d">全身から戻った血液が2つのえら心臓、左右のえら、1つの体心臓を経て全身へ送られる。位置や大きさを再現しない模式図。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#486e96"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f88"/></marker></defs><rect width="900" height="1110" rx="28" fill="#eef6f7"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#163c50" text-anchor="middle"><text x="450" y="72" font-size="39" font-weight="800">血液の流れで見る「3つ」</text><text x="450" y="116" font-size="27">上から下へ、ひと巡り</text><rect x="180" y="152" width="540" height="110" rx="22" fill="#fff" stroke="#b4cbd4" stroke-width="3"/><text x="450" y="200" font-size="35" font-weight="700">全身から戻った血液</text><text x="450" y="239" font-size="26">体に酸素を渡した後</text><g fill="none" stroke="#486e96" stroke-width="8" marker-end="url(#a)"><path d="M450 270V294H240V330"/><path d="M450 294H660V330"/><path d="M240 460V512"/><path d="M660 460V512"/></g><rect x="70" y="343" width="340" height="113" rx="22" fill="#dfebfa" stroke="#486e96" stroke-width="3"/><rect x="490" y="343" width="340" height="113" rx="22" fill="#dfebfa" stroke="#486e96" stroke-width="3"/><text x="240" y="389" font-size="36" font-weight="800">えら心臓</text><text x="660" y="389" font-size="36" font-weight="800">えら心臓</text><text x="240" y="430" font-size="27">えらへ送る</text><text x="660" y="430" font-size="27">えらへ送る</text><rect x="70" y="531" width="340" height="123" rx="22" fill="#fff" stroke="#087f88" stroke-width="3"/><rect x="490" y="531" width="340" height="123" rx="22" fill="#fff" stroke="#087f88" stroke-width="3"/><text x="240" y="578" font-size="36" font-weight="800">えら</text><text x="660" y="578" font-size="36" font-weight="800">えら</text><text x="240" y="623" font-size="29" fill="#087f88">酸素を受け取る</text><text x="660" y="623" font-size="29" fill="#087f88">酸素を受け取る</text><g fill="none" stroke="#087f88" stroke-width="8"><path d="M240 661V701H450"/><path d="M660 661V701H450"/><path d="M450 701V744" marker-end="url(#b)"/><path d="M450 884V927" marker-end="url(#b)"/></g><rect x="240" y="761" width="420" height="120" rx="22" fill="#c8ece8" stroke="#087f88" stroke-width="3"/><text x="450" y="809" font-size="38" font-weight="800">体心臓</text><text x="450" y="853" font-size="29">酸素を得た血液を送る</text><rect x="240" y="946" width="420" height="86" rx="22" fill="#fff" stroke="#b4cbd4" stroke-width="3"/><text x="450" y="1002" font-size="36" font-weight="800">ふたたび全身へ</text><text x="450" y="1080" font-size="25">※ 臓器の位置・形・大きさは再現していません。</text></g></svg>